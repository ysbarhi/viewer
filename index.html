<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Visualiseur 3D - Inspection</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #121212; /* Fond très sombre "dans le vide" */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #loader {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            z-index: 999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #ffcc00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #ui-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid #ffcc00;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-align: center;
            pointer-events: none;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loading-text">Chargement du modèle...</div>
    </div>

    <div id="canvas-container"></div>
    <div id="ui-panel" style="display: none;">Pièce identifiée</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, controls;
        
        // Récupération de l'ID depuis le QR Code
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // Scène "dans le vide"
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace; 
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Éclairage neutre pour bien voir toutes les pièces
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(10, 20, 15);
            scene.add(directionalLight);

            const loader = new GLTFLoader();
            
            // Chargement du fichier GLB
            loader.load('scene.glb', function (gltf) {
                const model = gltf.scene;
                scene.add(model);

                let objectFound = false;

                if (targetId) {
                    model.traverse(function (node) {
                        if (node.isMesh && node.name.includes(targetId)) {
                            objectFound = true;
                            
                            // Matériau très voyant pour la pièce scannée
                            const highlightMaterial = new THREE.MeshStandardMaterial({
                                color: 0xffcc00,          // Jaune
                                emissive: 0xffaa00,       // Émission lumineuse
                                emissiveIntensity: 0.8,
                                roughness: 0.2,
                                metalness: 0.1,
                                depthTest: false          // Permet de voir la surbrillance même à travers d'autres objets
                            });
                            
                            node.material = highlightMaterial;
                            node.renderOrder = 999; // Affiche cet objet en priorité par-dessus les autres

                            // Calcul de la boîte englobante pour centrer et zoomer parfaitement
                            const box = new THREE.Box3().setFromObject(node);
                            const center = box.getCenter(new THREE.Vector3());
                            const size = box.getSize(new THREE.Vector3());
                            
                            // On centre la rotation sur la pièce
                            controls.target.copy(center);
                            
                            // On recule la caméra proportionnellement à la taille de la pièce
                            const maxDim = Math.max(size.x, size.y, size.z);
                            const cameraDistance = maxDim * 2.5; 
                            
                            camera.position.set(center.x + cameraDistance, center.y + cameraDistance, center.z + cameraDistance);
                        }
                    });
                }

                // Cacher l'écran de chargement
                const loaderElement = document.getElementById('loader');
                loaderElement.style.opacity = '0';
                setTimeout(() => loaderElement.style.display = 'none', 500);

                // Message UI
                if (objectFound) {
                    const uiPanel = document.getElementById('ui-panel');
                    uiPanel.style.display = 'block';
                    uiPanel.innerText = `Focus: ${targetId.replace('obj_', '').split('_')[0]}`; 
                    // Affiche uniquement le nom de base sans le timestamp pour plus de lisibilité
                } else if (!targetId) {
                    // Centrage global si aucun QR code n'est ciblé
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    controls.target.copy(center);
                    camera.position.set(center.x + 5, center.y + 5, center.z + 5);
                }

            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
