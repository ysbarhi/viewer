<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Viewer CAO - Lecteur Local</title>
    
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #e5e5e5; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #start-menu {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e5e5e5; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 900;
        }
        #file-btn {
            background: #2563eb; color: #ffffff; border: none;
            padding: 15px 30px; border-radius: 10px; font-size: 18px; font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; margin-top: 20px;
        }
        #file-btn:active { background: #1d4ed8; transform: scale(0.98); }
        
        #loader {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(229, 229, 229, 0.9); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 999;
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid #bbb;
            border-top: 4px solid #ff0000; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #version-badge { font-weight: bold; font-size: 18px; color: #333; text-align: center; }
        
        #ui-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: #ffffff; border: 2px solid #ff0000; color: #000; 
            padding: 10px 20px; border-radius: 5px; font-weight: bold; font-size: 16px;
            pointer-events: none; white-space: nowrap; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 50; display: none;
        }

        #scan-btn {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: #000000; color: #ffffff; border: 2px solid #ffffff;
            padding: 12px 25px; border-radius: 30px; font-size: 16px; font-weight: bold;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3); z-index: 100; display: none;
        }
        #scan-btn:active { background: #333333; transform: translateX(-50%) scale(0.95); }

        /* UI DES CONTRÔLES (Textures + Sliders) */
        #controls-container {
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 350px; background: rgba(0, 0, 0, 0.75);
            padding: 15px; border-radius: 15px; display: none; flex-direction: column;
            z-index: 90; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .control-group {
            width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 12px;
        }
        .control-group:last-child { margin-bottom: 0; }
        
        .control-group label { color: white; font-weight: bold; font-size: 13px; margin-bottom: 5px; }
        .control-group input[type="range"] { width: 100%; margin: 0; }
        
        .slider-labels {
            display: flex; justify-content: space-between; width: 100%;
            color: #ddd; font-size: 11px; font-weight: bold; margin-top: 2px;
        }

        /* Bouton Texture */
        #texture-btn {
            width: 100%; padding: 8px; border-radius: 8px; border: none; font-weight: bold;
            font-size: 14px; cursor: pointer; transition: background 0.2s;
        }
        #texture-btn.off { background: #555555; color: #cccccc; }
        #texture-btn.on { background: #2563eb; color: #ffffff; }

        #close-project-btn {
            position: absolute; top: 20px; right: 20px;
            background: #666; color: white; border: none; padding: 10px; border-radius: 5px;
            font-weight: bold; z-index: 50; display: none;
        }

        #reader-container {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000; z-index: 1000;
        }
        #close-scan-btn {
            position: absolute; top: 20px; right: 20px; background: #ff0000; color: white;
            border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; z-index: 1001;
        }
        #reader { width: 100vw; height: 100vh; }
    </style>
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="start-menu">
        <div id="version-badge">VERSION 17.0<br>(Textures + Rayon X + Éclaté)</div>
        <button id="file-btn">📁 CHARGER UN MEUBLE (.glb)</button>
        <input type="file" id="file-input" accept=".glb" style="display: none;">
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <div style="font-weight: bold; color: #333;">Préparation de la 3D...</div>
    </div>
    
    <button id="close-project-btn">✕ Fermer le projet</button>
    <div id="ui-panel">PIÈCE : ...</div>
    <div id="canvas-container"></div>
    
    <!-- Boîte de contrôles -->
    <div id="controls-container">
        <div class="control-group">
            <label>Matières & Textures</label>
            <button id="texture-btn" class="off">DÉSACTIVÉ (Gris uni)</button>
        </div>
        <div class="control-group">
            <label>Visibilité Globale (Rayon X)</label>
            <input type="range" id="opacity-slider" min="0" max="4" step="1" value="4">
            <div class="slider-labels">
                <span>10%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
            </div>
        </div>
        <div class="control-group">
            <label>Vue Éclatée (Explosion)</label>
            <input type="range" id="explode-slider" min="0" max="100" step="1" value="0">
            <div class="slider-labels">
                <span>Assemblé</span><span>Éclaté</span>
            </div>
        </div>
    </div>

    <button id="scan-btn">📷 SCANNER</button>

    <div id="reader-container">
        <button id="close-scan-btn">Annuler</button>
        <div id="reader"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, controls, globalModel;

        // États globaux
        let isTextureOn = false;
        let currentOpacity = 1.0;
        const opacityValues = [0.10, 0.25, 0.50, 0.75, 1.0];

        const baseMaterial = new THREE.MeshLambertMaterial({ 
            color: 0xd5d5d5, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, 
            transparent: true, opacity: 1.0 
        });
        
        const highlightMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xff0000, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
            transparent: false, opacity: 1.0
        });
        
        const edgeMaterial = new THREE.LineBasicMaterial({ 
            color: 0x000000, transparent: true, opacity: 1.0 
        });

        init();
        animate();
        setupScanner();
        setupFileUploader();
        setupControls();

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe5e5e5);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.0001, 10000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.1;
            controls.enablePan = true; 
            controls.screenSpacePanning = true; 
            controls.minDistance = 0.00001; 
            controls.zoomSpeed = 2.5; 

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            window.addEventListener('resize', onWindowResize, false);
        }

        // Fonction centralisée pour appliquer les bons matériaux en fonction des 3 états (Texture, Opacité, Highlight)
        function updateMaterials() {
            if (!globalModel) return;
            
            baseMaterial.opacity = currentOpacity;
            edgeMaterial.opacity = currentOpacity;

            globalModel.traverse(function (node) {
                if (node.isMesh && node.userData.isOriginalMesh) {
                    if (node.userData.isHighlighted) {
                        // Reste toujours rouge vif
                        node.material = highlightMaterial;
                    } else {
                        // Alterne entre texture originale ou gris de base
                        if (isTextureOn && node.userData.originalMaterial) {
                            node.material = node.userData.originalMaterial;
                            node.material.opacity = currentOpacity;
                        } else {
                            node.material = baseMaterial;
                        }
                    }
                }
            });
        }

        function setupControls() {
            // Bouton Texture
            const textureBtn = document.getElementById('texture-btn');
            textureBtn.addEventListener('click', () => {
                isTextureOn = !isTextureOn;
                if (isTextureOn) {
                    textureBtn.classList.remove('off');
                    textureBtn.classList.add('on');
                    textureBtn.innerText = 'ACTIVÉ (Textures du fichier)';
                } else {
                    textureBtn.classList.remove('on');
                    textureBtn.classList.add('off');
                    textureBtn.innerText = 'DÉSACTIVÉ (Gris uni)';
                }
                updateMaterials();
            });

            // Slider Opacité
            const opacitySlider = document.getElementById('opacity-slider');
            opacitySlider.addEventListener('input', (e) => {
                currentOpacity = opacityValues[e.target.value];
                updateMaterials();
            });

            // Slider Explosion
            const explodeSlider = document.getElementById('explode-slider');
            explodeSlider.addEventListener('input', (e) => {
                if (!globalModel) return;
                const factor = (e.target.value / 100) * 1.5;
                globalModel.traverse(function (node) {
                    if (node.isMesh && node.userData.isOriginalMesh) {
                        node.position.copy(node.userData.originalPosition)
                            .addScaledVector(node.userData.explodeDirection, factor);
                    }
                });
            });
        }

        function setupFileUploader() {
            const fileBtn = document.getElementById('file-btn');
            const fileInput = document.getElementById('file-input');
            const closeProjectBtn = document.getElementById('close-project-btn');

            fileBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (file) {
                    const objectUrl = URL.createObjectURL(file);
                    loadModelFromUrl(objectUrl);
                }
            });

            closeProjectBtn.addEventListener('click', () => {
                if (globalModel) {
                    scene.remove(globalModel);
                    globalModel = null;
                }
                document.getElementById('start-menu').style.display = 'flex';
                document.getElementById('scan-btn').style.display = 'none';
                document.getElementById('controls-container').style.display = 'none';
                closeProjectBtn.style.display = 'none';
                document.getElementById('ui-panel').style.display = 'none';
                fileInput.value = ""; 
                
                // Réinitialiser les états
                document.getElementById('opacity-slider').value = 4;
                document.getElementById('explode-slider').value = 0;
                document.getElementById('texture-btn').className = 'off';
                document.getElementById('texture-btn').innerText = 'DÉSACTIVÉ (Gris uni)';
                isTextureOn = false;
                currentOpacity = 1.0;
                baseMaterial.opacity = 1.0;
                edgeMaterial.opacity = 1.0;
            });
        }

        function loadModelFromUrl(url) {
            document.getElementById('start-menu').style.display = 'none';
            document.getElementById('loader').style.display = 'flex';

            const loader = new GLTFLoader();
            loader.load(url, function (gltf) {
                globalModel = gltf.scene;
                scene.add(globalModel);
                scene.updateMatrixWorld(true);

                const globalBox = new THREE.Box3().setFromObject(globalModel);
                const globalCenter = new THREE.Vector3();
                globalBox.getCenter(globalCenter);

                globalModel.traverse(function (node) {
                    if (node.isMesh) {
                        node.userData.isOriginalMesh = true;
                        node.userData.isHighlighted = false;
                        
                        // Sauvegarde du matériau original (texture) pour permettre la transparence
                        node.userData.originalMaterial = node.material.clone();
                        node.userData.originalMaterial.transparent = true;
                        node.userData.originalMaterial.polygonOffset = true;
                        node.userData.originalMaterial.polygonOffsetFactor = 1;
                        node.userData.originalMaterial.polygonOffsetUnits = 1;

                        // Application du matériau gris par défaut
                        node.material = baseMaterial;
                        const edgesGeometry = new THREE.EdgesGeometry(node.geometry, 30);
                        const edges = new THREE.LineSegments(edgesGeometry, edgeMaterial);
                        node.add(edges);

                        // Calculs pour l'explosion
                        node.userData.originalPosition = node.position.clone();
                        const meshBox = new THREE.Box3().setFromObject(node);
                        const meshCenter = new THREE.Vector3();
                        meshBox.getCenter(meshCenter);
                        
                        if (node.parent) {
                            const localGlobalCenter = node.parent.worldToLocal(globalCenter.clone());
                            const localMeshCenter = node.parent.worldToLocal(meshCenter.clone());
                            node.userData.explodeDirection = new THREE.Vector3().subVectors(localMeshCenter, localGlobalCenter);
                        } else {
                            node.userData.explodeDirection = new THREE.Vector3().subVectors(meshCenter, globalCenter);
                        }
                    }
                });

                controls.target.copy(globalCenter);
                const size = new THREE.Vector3();
                globalBox.getSize(size);
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(globalCenter.x + maxDim, globalCenter.y + maxDim, globalCenter.z + maxDim);

                controls.update();
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('scan-btn').style.display = 'block';
                document.getElementById('controls-container').style.display = 'flex';
                document.getElementById('close-project-btn').style.display = 'block';
                
                URL.revokeObjectURL(url);
            });
        }

        function highlightScannedPart(scannedText) {
            const rawScan = scannedText.toLowerCase();
            const cleanScan = rawScan.replace(/[^a-z0-9]/g, '');

            let targetMeshes = [];

            // Réinitialiser les surbrillances
            globalModel.traverse(function (node) {
                if (node.isMesh && node.userData.isOriginalMesh) {
                    node.userData.isHighlighted = false;
                }
            });

            // Chercher la pièce
            globalModel.traverse(function (node) {
                if (node.isMesh && node.userData.isOriginalMesh) {
                    let matchFound = false;
                    let current = node;
                    
                    while (current && current !== globalModel) {
                        if (current.name) {
                            const rawName = current.name.toLowerCase();
                            const cleanName = rawName.replace(/[^a-z0-9]/g, '');
                            
                            if (cleanName.length > 0) {
                                if (cleanName === cleanScan) { matchFound = true; break; }
                                else if (cleanName.length > 3 && cleanScan.includes(cleanName)) { matchFound = true; break; }
                                else if (cleanScan.length > 3 && cleanName.includes(cleanScan)) { matchFound = true; break; }
                            }
                        }
                        current = current.parent;
                    }
                    if (matchFound) {
                        node.userData.isHighlighted = true;
                        targetMeshes.push(node);
                    }
                }
            });

            // Appliquer les matériaux corrects
            updateMaterials();

            if (targetMeshes.length > 0) {
                const box = new THREE.Box3();
                targetMeshes.forEach(m => {
                    const childBox = new THREE.Box3().setFromObject(m);
                    box.union(childBox);
                });

                const center = new THREE.Vector3();
                box.getCenter(center);
                const size = new THREE.Vector3();
                box.getSize(size);

                controls.target.copy(center);

                const maxDim = Math.max(size.x, size.y, size.z);
                const cameraDistance = maxDim * 1.5; 
                camera.position.set(center.x + cameraDistance, center.y + cameraDistance, center.z + cameraDistance);
                
                const uiPanel = document.getElementById('ui-panel');
                uiPanel.style.display = 'block';
                uiPanel.innerText = `CIBLE : ${scannedText.replace(/[^a-zA-Z0-9_-]/g, ' ').trim()}`;
            } else {
                alert("Pièce introuvable dans ce meuble.\nCode lu : " + scannedText);
            }
        }

        function setupScanner() {
            const scanBtn = document.getElementById('scan-btn');
            const closeBtn = document.getElementById('close-scan-btn');
            const container = document.getElementById('reader-container');
            let html5QrCode = null;

            scanBtn.addEventListener('click', () => {
                container.style.display = 'block';
                html5QrCode = new Html5Qrcode("reader");
                
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        html5QrCode.stop().then(() => {
                            container.style.display = 'none';
                            highlightScannedPart(decodedText);
                        });
                    },
                    (errorMessage) => {}
                ).catch(err => {
                    alert("Impossible d'accéder à la caméra.");
                    container.style.display = 'none';
                });
            });

            closeBtn.addEventListener('click', () => {
                if(html5QrCode) {
                    html5QrCode.stop().then(() => { container.style.display = 'none'; });
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
