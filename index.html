<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Configuration viewport pour une expérience mobile optimale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Visualiseur 3D interactif</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Style de l'indicateur de chargement */
        #loader {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            z-index: 999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffcc00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #ui-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-align: center;
            pointer-events: none;
            font-size: 14px;
            white-space: nowrap;
        }
    </style>
    <!-- Utilisation d'Import Maps pour charger Three.js proprement depuis le CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loading-text">Chargement du modèle 3D...</div>
    </div>

    <div id="canvas-container"></div>
    <div id="ui-panel" style="display: none;">Objet trouvé</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, controls;
        
        // 1. Récupération de l'ID cible depuis l'URL (ex: ?id=obj_table_12345)
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // Scène et Caméra
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202020);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            // Rendu
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // Amélioration de la gestion de la lumière pour le GLTF
            renderer.outputColorSpace = THREE.SRGBColorSpace; 
            container.appendChild(renderer.domElement);

            // Contrôles de navigation (OrbitControls)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Éclairage (Lumière ambiante + lumière directionnelle douce)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // Chargement du modèle GLTF
            const loader = new GLTFLoader();
            
            // On charge "scene.gltf" présent dans le même dossier
            loader.load('scene.gltf', function (gltf) {
                const model = gltf.scene;
                scene.add(model);

                let objectFound = false;

                // 2. Parcourir le modèle à la recherche de l'objet correspondant à targetId
                if (targetId) {
                    model.traverse(function (node) {
                        // On vérifie si le nom du nœud correspond à l'ID 
                        // (SketchUp peut parfois rajouter des préfixes/suffixes lors de l'export)
                        if (node.isMesh && node.name.includes(targetId)) {
                            objectFound = true;
                            
                            // 3. Mise en surbrillance : Matériau jaune vif émissif
                            const highlightMaterial = new THREE.MeshStandardMaterial({
                                color: 0xffcc00,
                                emissive: 0xffcc00,
                                emissiveIntensity: 0.5,
                                roughness: 0.2,
                                metalness: 0.1
                            });
                            
                            // On sauvegarde l'ancien matériau au cas où, et on applique le nouveau
                            node.material = highlightMaterial;

                            // Centrer la caméra sur l'objet trouvé
                            const box = new THREE.Box3().setFromObject(node);
                            const center = box.getCenter(new THREE.Vector3());
                            controls.target.copy(center);
                            camera.position.set(center.x + 3, center.y + 3, center.z + 3);
                        }
                    });
                }

                // Cacher l'écran de chargement
                const loaderElement = document.getElementById('loader');
                loaderElement.style.opacity = '0';
                setTimeout(() => loaderElement.style.display = 'none', 500);

                // Afficher un petit panel informatif si l'objet est ciblé
                if (objectFound) {
                    const uiPanel = document.getElementById('ui-panel');
                    uiPanel.style.display = 'block';
                    uiPanel.innerText = `Focus sur : ${targetId}`;
                }

            }, 
            // Progression du chargement
            function (xhr) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                const text = document.getElementById('loading-text');
                if (percent) {
                    text.innerText = `Chargement... ${percent}%`;
                }
            }, 
            // Gestion des erreurs
            function (error) {
                console.error('Erreur lors du chargement du modèle:', error);
                document.getElementById('loading-text').innerText = "Erreur de chargement du modèle.";
            });

            // Gérer le redimensionnement de l'écran (ex: rotation du smartphone)
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
