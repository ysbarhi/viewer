                } else {
                    animBanner.style.display = 'none';
                    setAnimPipsVisible(false);
                    resetAllAnimations(false);
                }
            });
            
            assemblyBtn.addEventListener('click', () => {
                if (!globalModel) return;

                // Si le mode animation était actif, on le referme proprement
                if (isAnimationModeOn) {
                    isAnimationModeOn = false;
                    animBtn.classList.remove('active');
                    animBanner.style.display = 'none';
                    setAnimPipsVisible(false);
                    resetAllAnimations(true);
                }
                
                isAssemblyModeOn = !isAssemblyModeOn;
                assemblyBtn.classList.toggle('active', isAssemblyModeOn);
                
                if (isAssemblyModeOn) {
                    slider.min = "0";
                    slider.max = maxAssemblyStep.toString();
                    slider.step = "1";
                    slider.value = "0"; 
                    
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                    stepInd.classList.add('active');
                } else {
                    slider.min = "0";
                    slider.max = "100";
                    slider.step = "1";
                    slider.value = "0";
                    
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                    stepInd.classList.remove('active');
                }
                
                renderSliderTicks();
                slider.dispatchEvent(new Event('input'));
            });

            prevBtn.addEventListener('click', () => {
                if (!isAssemblyModeOn) return;
                let val = parseInt(slider.value, 10);
                if (val > 0) {
                    slider.value = val - 1;
                    slider.dispatchEvent(new Event('input'));
                }
            });

            nextBtn.addEventListener('click', () => {
                if (!isAssemblyModeOn) return;
                let val = parseInt(slider.value, 10);
                if (val < maxAssemblyStep) {
                    slider.value = val + 1;
                    slider.dispatchEvent(new Event('input'));
                }
            });

            slider.addEventListener('input', (e) => {
                if (!globalModel) return;
                const val = parseFloat(e.target.value);

                // Si l'utilisateur manipule l'éclatement pendant que des portes sont ouvertes, on les referme
                if (val > 0 && isAnimationModeOn) {
                    isAnimationModeOn = false;
                    animBtn.classList.remove('active');
                    animBanner.style.display = 'none';
                    setAnimPipsVisible(false);
                    resetAllAnimations(true);
                }
                
                const phaseBanner = document.getElementById('phase-banner');
                const phaseInd = document.getElementById('phase-indicator');
                if (isAssemblyModeOn) {
                    stepInd.innerText = `${val}/${maxAssemblyStep}`;
                    if (phaseBanner) {
                        const txt = assemblyPhaseLabel(val);
                        phaseBanner.innerText = txt;
                        phaseBanner.style.display = txt ? 'block' : 'none';
                    }
                    if (phaseInd) {
                        const counter = assemblyPhaseCounter(val);
                        phaseInd.innerText = counter;
                        phaseInd.style.display = counter ? 'block' : 'none';
                    }
                } else {
                    if (phaseBanner) phaseBanner.style.display = 'none';
                    if (phaseInd) phaseInd.style.display = 'none';
                }

                globalModel.traverse(function (node) {
                    if (node.userData.isPartNode) {
                        // Remettre l'orientation initiale avant d'appliquer la translation d'éclatement
                        if (node.userData.originalQuaternion) node.quaternion.copy(node.userData.originalQuaternion);
                        if (node.userData.originalScale) node.scale.copy(node.userData.originalScale);

                        if (isAssemblyModeOn && assemblyHierarchy && node.userData.seq) {
                            // Séquence hiérarchique : éclatement du sous-ensemble + éclatement local de la pièce
                            const sq = node.userData.seq;
                            node.position.copy(node.userData.originalPosition);
                            const parentDone = !(sq.group.final_step > 0) ||
                                               val >= assemblyHierarchy.finalOffset + sq.group.final_step;
                            if (!parentDone) node.position.addScaledVector(sq.groupDir, 1.5 * 0.85);
                            if (val < sq.globalStep) node.position.addScaledVector(sq.localDir, 1.5);
                        } else if (isAssemblyModeOn) {
                            if (node.userData.assemblyStep > val) {
                                node.position.copy(node.userData.originalPosition)
                                    .addScaledVector(node.userData.explodeDirection, 1.5);
                            } else {
                                node.position.copy(node.userData.originalPosition);
                            }
                        } else {
                            const factor = (val / 100) * 1.5;
                            node.position.copy(node.userData.originalPosition)
                                .addScaledVector(node.userData.explodeDirection, factor);
                        }
                    }
                });

                if (highlightedMeshes && highlightedMeshes.length > 0) {
                    activeBox = new THREE.Box3();
                    highlightedMeshes.forEach(m => activeBox.union(new THREE.Box3().setFromObject(m)));
                } else {
                    activeBox = new THREE.Box3().setFromObject(globalModel);
                }
            });

            const touchSelectToggle = document.getElementById('touch-toggle');
            const multiBtn = document.getElementById('multi-select-btn');
            touchSelectToggle.addEventListener('click', () => {
                isTouchSelectOn = !isTouchSelectOn;
                touchSelectToggle.classList.toggle('toggle-on', isTouchSelectOn);
                multiBtn.classList.toggle('disabled', !isTouchSelectOn);
            });

            // Multisélection : maintenir (pouce gauche) + toucher les pièces (pouce droit). Relâcher = retour sélection simple.
            const startMultiHold = (e) => {
                e.preventDefault();
                if (!isTouchSelectOn) { showToast("Activez la sélection tactile"); return; }
                isMultiHold = true;
                multiBtn.classList.add('active');
                try { multiBtn.setPointerCapture(e.pointerId); } catch (_) {}
            };
            const endMultiHold = () => {
                isMultiHold = false;
                multiBtn.classList.remove('active');
            };
            multiBtn.addEventListener('pointerdown', startMultiHold);
            multiBtn.addEventListener('pointerup', endMultiHold);
            multiBtn.addEventListener('pointercancel', endMultiHold);
            multiBtn.addEventListener('lostpointercapture', endMultiHold);
            multiBtn.addEventListener('contextmenu', (e) => e.preventDefault());

            const canvasEl = renderer.domElement;
            canvasEl.addEventListener('pointerdown', (e) => {
                touchPointerDown.x = e.clientX;
                touchPointerDown.y = e.clientY;
            });

            canvasEl.addEventListener('pointerup', (e) => {
                if (!globalModel) return;
                if (isTapeModeOn) return;   // le mètre ruban gère ses propres clics
                // Ignorer si l'utilisateur a fait tourner la caméra (glisser > 10px)
                if (Math.abs(e.clientX - touchPointerDown.x) > 10 || Math.abs(e.clientY - touchPointerDown.y) > 10) return;

                // On n'intercepte le clic que si le Mode Animation OU la Sélection Tactile est actif
                if (!isAnimationModeOn && !isTouchSelectOn) return;

                const rect = canvasEl.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(globalModel, true);
                // Les pièces masquées (isolation) sont ignorées => un tap "dans le vide" reste un tap dans le vide
                const validIntersects = intersects.filter(i =>
                    i.object.isMesh && i.object.userData.isOriginalMesh && i.object.layers.test(camera.layers));
                const additive = isMultiHold || e.ctrlKey || e.metaKey || e.shiftKey;

                if (validIntersects.length > 0) {
                    const hitMesh = validIntersects[0].object;
                    const partRoot = hitMesh.userData.partRoot || hitMesh;

                    // 1. PRIORITÉ AU MODE ANIMATION s'il est activé
                    if (isAnimationModeOn) {
                        const animated = togglePartOpenClose(partRoot);
                        if (animated) {
                            const host = (partRoot.userData.hostPart && partRoot.userData.hostPart.userData.animationCfg)
                                ? partRoot.userData.hostPart : partRoot;
                            const cleanName = (host.name || "Ouvrant").replace(/[^a-zA-Z0-9_-]/g, ' ').trim();
                            const isOpening = host.userData.animState.target > 0.5;
                            animBanner.innerText = `${isOpening ? '🔓 Ouverture' : '🔒 Fermeture'} : ${cleanName}`;
                        } else {
                            const cleanName = (partRoot.name || "Pièce").replace(/[^a-zA-Z0-9_-]/g, ' ').trim();
                            animBanner.innerText = `ℹ️ Aucune animation sur : ${cleanName}`;
                        }
                        // Si la sélection tactile est aussi activée, on affiche aussi les cotes
                        if (isTouchSelectOn) {
                            selectPartByMesh(hitMesh);
                        }
                        return;
                    }

                    // 2. MODE SÉLECTION TACTILE : 1 tap = pièce, 2 taps = sous-ensemble, 3 taps = ensemble
                    if (isTouchSelectOn) {
                        const tap = registerTap(e, hitMesh);
                        selectPartAtLevel(tap.mesh, tap.count, additive);
                    }
                } else if (isTouchSelectOn && !isAnimationModeOn) {
                    lastTap = null;
                    if (!additive) clearSelection();   // même comportement en mode isolé ou non
                }
            });

            const measureBtn = document.getElementById('measure-toggle-btn');
            const syncMeasureBtn = () => {
                measureBtn.classList.toggle('off', !showMeasurements);
                measureBtn.title = showMeasurements ? 'Masquer les cotes' : 'Afficher les cotes';
            };
            measureBtn.addEventListener('click', () => {
                showMeasurements = !showMeasurements;
                syncMeasureBtn();
                updateMeasurementLabels();
            });
            syncMeasureBtn();

            const matToggleBtn = document.getElementById('mat-toggle-btn');
            matToggleBtn.addEventListener('click', () => {
                const collapsed = document.body.classList.toggle('mats-collapsed');
                matToggleBtn.title = collapsed ? 'Afficher les matériaux' : 'Masquer les matériaux';
            });

            document.getElementById('zoom-btn').addEventListener('click', () => {
                if (!globalModel) return;
                if (highlightedMeshes.length > 0) {
                    if (isZoomedOnPart) {
                        focusOnGlobalModel();
                        isZoomedOnPart = false;
                    } else {
                        focusOnHighlightedPart();
                        isZoomedOnPart = true;
                    }
                } else {
                    focusOnGlobalModel();
                }
            });

            // Bouton unique des 3 styles : Gris -> Rayons X -> Texturé
            document.getElementById('style-btn').addEventListener('click', () => {
                setStyleMode((styleModeIndex + 1) % STYLE_MODES.length);
            });

            const edgeBtn = document.getElementById('edge-btn');
            edgeBtn.addEventListener('click', () => {
                isEdgeBandingOn = !isEdgeBandingOn;
                edgeBtn.classList.toggle('active', isEdgeBandingOn);
                updateMaterials();
            });

            document.getElementById('isolate-btn').addEventListener('click', toggleIsolation);
        }

        // ==========================================
        // MÈTRE RUBAN : mesure dynamique 3D avec accrochage souple
        // ==========================================
        function setupTape() {
            tapeEls = {
                btn: document.getElementById('tape-btn'),
                layer: document.getElementById('tape-layer'),
                label: document.getElementById('tape-label'),
                a: document.getElementById('tape-pip-a'),
                b: document.getElementById('tape-pip-b')
            };
            tapeEls.btn.addEventListener('click', () => setTapeMode(!isTapeModeOn));

            const canvasEl = renderer.domElement;

            // Nouveau ruban : appui + glisser
            canvasEl.addEventListener('pointerdown', (e) => {
                if (!isTapeModeOn || !globalModel) return;
                if (!e.isPrimary) { cancelTapeDrag(); return; }          // 2e doigt = navigation
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                const p = pickTapePoint(e.clientX, e.clientY, null);
                if (!p) return;
                tapeDrag = { which: 'b', pointerId: e.pointerId, backup: tape ? cloneTape(tape) : null,
                             sx: e.clientX, sy: e.clientY, ox: 0, oy: 0, moved: false, fromPip: false };
                tape = { a: p.point.clone(), b: p.point.clone(), kindA: p.kind, kindB: p.kind, axis: null };
                refreshTape();
            });
            canvasEl.addEventListener('pointermove', (e) => {
                if (tapeDrag && !tapeDrag.fromPip && e.pointerId === tapeDrag.pointerId) moveTapeEnd(e);
            });
            canvasEl.addEventListener('pointerup', (e) => {
                if (tapeDrag && !tapeDrag.fromPip && e.pointerId === tapeDrag.pointerId) finishTapeDrag();
            });
            canvasEl.addEventListener('pointercancel', (e) => {
                if (tapeDrag && e.pointerId === tapeDrag.pointerId) cancelTapeDrag();
            });

            // Ajustement : glisser une extrémité
            ['a', 'b'].forEach(which => {
                const pip = tapeEls[which];
                pip.addEventListener('pointerdown', (e) => {
                    if (!isTapeModeOn || !tape) return;
                    e.preventDefault();
                    e.stopPropagation();
                    pip.setPointerCapture(e.pointerId);
                    const rect = renderer.domElement.getBoundingClientRect();
                    _tp.copy(tape[which]).project(camera);
                    const px = rect.left + (_tp.x * 0.5 + 0.5) * rect.width;
                    const py = rect.top + (-_tp.y * 0.5 + 0.5) * rect.height;
                    tapeDrag = { which, pointerId: e.pointerId, backup: cloneTape(tape),
                                 sx: e.clientX, sy: e.clientY, ox: px - e.clientX, oy: py - e.clientY,
                                 moved: false, fromPip: true };
                    refreshTape();
                });
                pip.addEventListener('pointermove', (e) => {
                    if (tapeDrag && tapeDrag.fromPip && e.pointerId === tapeDrag.pointerId) moveTapeEnd(e);
                });
                pip.addEventListener('pointerup', (e) => {
                    if (tapeDrag && tapeDrag.fromPip && e.pointerId === tapeDrag.pointerId) finishTapeDrag();
                });
                pip.addEventListener('pointercancel', (e) => {
                    if (tapeDrag && e.pointerId === tapeDrag.pointerId) cancelTapeDrag();
                });
            });
        }

        // 1er appui = actif (réaffiche le dernier ruban), 2e appui = masqué mais mémorisé
        function setTapeMode(on) {
            isTapeModeOn = !!on && !!globalModel;
            if (tapeEls) tapeEls.btn.classList.toggle('active', isTapeModeOn);
            if (isTapeModeOn) {
                controls.touches.ONE = null;                          // 1 doigt = ruban
                controls.touches.TWO = THREE.TOUCH.DOLLY_ROTATE;      // 2 doigts = zoom + rotation
                controls.mouseButtons.LEFT = null;                    // clic gauche = ruban
                controls.mouseButtons.MIDDLE = THREE.MOUSE.PAN;
                controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
            } else {
                tapeDrag = null;
                controls.touches.ONE = THREE.TOUCH.ROTATE;
                controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;
                controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
                controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
                controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
            }
            refreshTape();
        }

        function rebuildTapeTargets() {
            tapeMeshes = [];
            tapeEdgeCache = new Map();
            if (!globalModel) return;
            globalModel.traverse(n => { if (n.isMesh && n.userData.isOriginalMesh) tapeMeshes.push(n); });
        }

        function cloneTape(t) {
            return { a: t.a.clone(), b: t.b.clone(), kindA: t.kindA, kindB: t.kindB, axis: t.axis };
        }

        function ensureTapeLine() {
            if (tapeLine) return;
            const geo = new LineSegmentsGeometry();
            geo.setPositions(new Float32Array(6));
            tapeBuf = geo.attributes.instanceStart.data;
            tapeLine = new LineSegments2(geo, tapeLineMat);
            tapeLine.frustumCulled = false;
            tapeLine.renderOrder = 1000;
            tapeLine.raycast = () => {};
            tapeLine.visible = false;
            scene.add(tapeLine);
        }

        // Arêtes réelles de chaque pièce (celles des traits noirs, pas la triangulation)
        function getEdgeLocal(mesh) {
            let arr = tapeEdgeCache.get(mesh);
            if (arr === undefined) {
                const ls = mesh.children.find(c => c.isLineSegments && c.geometry && c.geometry.attributes.position);
                arr = ls ? ls.geometry.attributes.position.array : null;
                tapeEdgeCache.set(mesh, arr);
            }
            return arr;
        }

        function distPointSeg2D(px, py, a, b) {
            const dx = b.x - a.x, dy = b.y - a.y;
            const L2 = dx * dx + dy * dy;
            let t = L2 > 0 ? ((px - a.x) * dx + (py - a.y) * dy) / L2 : 0;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
        }

        // Point du ruban sous le doigt. Priorité : sommet > arête > axe (depuis l'autre bout) > surface > plan écran.
        // Accrochage uniquement dans un rayon en pixels => s'éloigner suffit à le relâcher.
        function pickTapePoint(cx, cy, anchor) {
            const rect = renderer.domElement.getBoundingClientRect();
            const W = rect.width, H = rect.height;
            const sx = cx - rect.left, sy = cy - rect.top;
            _tRay.setFromCamera(new THREE.Vector2((sx / W) * 2 - 1, -(sy / H) * 2 + 1), camera);
            const ray = _tRay.ray;

            const proj = (v, out) => {
                _tp.copy(v).project(camera);
                if (_tp.z > 1 || _tp.z < -1) return false;
                out.x = (_tp.x * 0.5 + 0.5) * W;
                out.y = (-_tp.y * 0.5 + 0.5) * H;
                return true;
            };

            const hits = _tRay.intersectObjects(tapeMeshes, false);
            const hit = hits.length ? hits[0] : null;
            const maxDist = hit ? hit.distance * 1.02 + 0.003 : Infinity;   // pas d'accrochage derrière la surface visée
            const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

            let bestV = null, bestVd = TAPE_SNAP_VERTEX_PX;
            let bestE = null, bestEd = TAPE_SNAP_EDGE_PX;

            for (const mesh of tapeMeshes) {
                if (!mesh.layers.test(camera.layers)) continue;   // pièce masquée par l'isolation
                const g = mesh.geometry;
                if (!g) continue;
                if (!g.boundingSphere) g.computeBoundingSphere();
                _tc.copy(g.boundingSphere.center).applyMatrix4(mesh.matrixWorld);
                const rWorld = g.boundingSphere.radius * mesh.matrixWorld.getMaxScaleOnAxis();
                const dist = _tc.distanceTo(camera.position);
                if (dist - rWorld > maxDist) continue;
                if (dist > rWorld && proj(_tc, _s0)) {
                    const rPx = rWorld / (dist * tanHalf) * (H / 2);
                    if (Math.hypot(_s0.x - sx, _s0.y - sy) > rPx + TAPE_SNAP_VERTEX_PX) continue;
                }
                const arr = getEdgeLocal(mesh);
                if (!arr) continue;
                for (let i = 0; i + 5 < arr.length; i += 6) {
                    _e0.set(arr[i], arr[i + 1], arr[i + 2]).applyMatrix4(mesh.matrixWorld);
                    _e1.set(arr[i + 3], arr[i + 4], arr[i + 5]).applyMatrix4(mesh.matrixWorld);
                    const ok0 = proj(_e0, _s0);
                    const ok1 = proj(_e1, _s1);
                    if (ok0) {
                        const d = Math.hypot(_s0.x - sx, _s0.y - sy);
                        if (d < bestVd && camera.position.distanceTo(_e0) <= maxDist) { bestVd = d; bestV = _e0.clone(); }
                    }
                    if (ok1) {
                        const d = Math.hypot(_s1.x - sx, _s1.y - sy);
                        if (d < bestVd && camera.position.distanceTo(_e1) <= maxDist) { bestVd = d; bestV = _e1.clone(); }
                    }
                    if (ok0 && ok1) {
                        const d = distPointSeg2D(sx, sy, _s0, _s1);
                        if (d < bestEd) {
                            ray.distanceSqToSegment(_e0, _e1, undefined, _ep);
                            if (camera.position.distanceTo(_ep) <= maxDist) { bestEd = d; bestE = _ep.clone(); }
                        }
                    }
                }
            }
            if (bestV) return { point: bestV, kind: 'vertex', axis: null };
            if (bestE) return { point: bestE, kind: 'edge', axis: null };

            // Verrouillage sur les axes du modèle à partir de l'autre extrémité
            if (anchor && proj(anchor, _sA) && Math.hypot(sx - _sA.x, sy - _sA.y) > 24) {
                let bestA = null, bestAd = TAPE_SNAP_AXIS_PX;
                for (const ax of ['x', 'y', 'z']) {
                    _ad.set(ax === 'x' ? 1 : 0, ax === 'y' ? 1 : 0, ax === 'z' ? 1 : 0);
                    _a0.copy(anchor).addScaledVector(_ad, -1000);
                    _a1.copy(anchor).addScaledVector(_ad, 1000);
                    ray.distanceSqToSegment(_a0, _a1, undefined, _ap);
                    if (!proj(_ap, _s0)) continue;
                    const d = Math.hypot(_s0.x - sx, _s0.y - sy);
                    if (d < bestAd) { bestAd = d; bestA = { point: _ap.clone(), kind: 'axis', axis: ax }; }
                }
                if (bestA) return bestA;
            }

            if (hit) return { point: hit.point.clone(), kind: 'surface', axis: null };

            // Dans le vide : plan face caméra passant par l'autre extrémité
            if (anchor) {
                _tPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(_tm), anchor);
                if (ray.intersectPlane(_tPlane, _ap)) return { point: _ap.clone(), kind: 'free', axis: null };
            }
            return null;
        }

        function alignedAxis(a, b) {
            _al.subVectors(b, a);
            const L = _al.length();
            if (L < 1e-6) return null;
            _al.divideScalar(L);
            if (Math.abs(_al.x) > 0.99995) return 'x';
            if (Math.abs(_al.y) > 0.99995) return 'y';
            if (Math.abs(_al.z) > 0.99995) return 'z';
            return null;
        }

        function moveTapeEnd(e) {
            const d = tapeDrag;
            if (!d || !tape) return;
            if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 4) return;
            d.moved = true;
            const anchor = d.which === 'b' ? tape.a : tape.b;
            const p = pickTapePoint(e.clientX + d.ox, e.clientY + d.oy, anchor);
            if (!p) return;
            tape[d.which].copy(p.point);
            if (d.which === 'a') tape.kindA = p.kind; else tape.kindB = p.kind;
            tape.axis = p.kind === 'axis' ? p.axis : alignedAxis(tape.a, tape.b);
            refreshTape();
        }

        function tapeScreenLength(t) {
            const rect = renderer.domElement.getBoundingClientRect();
            _tp.copy(t.a).project(camera);
            const ax = _tp.x * rect.width / 2, ay = _tp.y * rect.height / 2;
            _tp.copy(t.b).project(camera);
            return Math.hypot(_tp.x * rect.width / 2 - ax, _tp.y * rect.height / 2 - ay);
        }

        function finishTapeDrag() {
            const d = tapeDrag;
            tapeDrag = null;
            if (!d) return;
            // Simple tap (sans glisser) ou ruban minuscule : on garde l'ancien ruban
            if (!d.fromPip && (!d.moved || !tape || tapeScreenLength(tape) < 8)) tape = d.backup;
            refreshTape();
        }

        function cancelTapeDrag() {
            if (!tapeDrag) return;
            tape = tapeDrag.backup;
            tapeDrag = null;
            refreshTape();
        }

        function formatTapeLength(m) {
            if (currentUnit === 'cm') return (m * 100).toFixed(2).replace(/\.?0+$/, '') + ' cm';
            return (m * 1000).toFixed(1).replace(/\.0$/, '') + ' mm';
        }

        function tapePipClass(kind, dragging) {
            return 'tape-pip' + (kind === 'vertex' ? ' snap-vertex' : kind === 'edge' ? ' snap-edge' : '') + (dragging ? ' dragging' : '');
        }

        function refreshTape() {
            ensureTapeLine();
            const show = isTapeModeOn && !!tape;
            tapeLine.visible = show;
            if (tapeEls) tapeEls.layer.classList.toggle('visible', show);
            if (!show) return;

            const arr = tapeBuf.array;
            arr[0] = tape.a.x; arr[1] = tape.a.y; arr[2] = tape.a.z;
            arr[3] = tape.b.x; arr[4] = tape.b.y; arr[5] = tape.b.z;
            tapeBuf.needsUpdate = true;

            const col = TAPE_AXIS_COLORS[tape.axis] || TAPE_COLOR;
            tapeLineMat.color.set(col);
            tapeEls.label.style.borderColor = col;
            tapeEls.a.className = tapePipClass(tape.kindA, tapeDrag && tapeDrag.which === 'a');
            tapeEls.b.className = tapePipClass(tape.kindB, tapeDrag && tapeDrag.which === 'b');
            updateTapeOverlay();
        }

        function placeTapeEl(el, v, rect) {
            _tp.copy(v).project(camera);
            if (_tp.z > 1) { el.style.display = 'none'; return; }
            el.style.display = 'block';
            el.style.left = (rect.left + (_tp.x * 0.5 + 0.5) * rect.width) + 'px';
            el.style.top = (rect.top + (-_tp.y * 0.5 + 0.5) * rect.height) + 'px';
        }

        // Chaque image : pips + compteur suivent la perspective (orbite, zoom)
        function updateTapeOverlay() {
            if (!isTapeModeOn || !tape || !tapeEls) return;
            const rect = renderer.domElement.getBoundingClientRect();
            placeTapeEl(tapeEls.a, tape.a, rect);
            placeTapeEl(tapeEls.b, tape.b, rect);
            _tm.addVectors(tape.a, tape.b).multiplyScalar(0.5);
            placeTapeEl(tapeEls.label, _tm, rect);
            const txt = formatTapeLength(tape.a.distanceTo(tape.b));
            if (tapeEls.label.textContent !== txt) tapeEls.label.textContent = txt;
        }

        // ==========================================
        // BASE DE DONNÉES INTERNE & GALERIE VISUELLE
        // ==========================================
        const DB_NAME = 'Finjat3D_DB';
        const STORE_NAME = 'models';
        let db;
        let currentLoadedFileName = null; 

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 2); 
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'name' });
                    }
                };
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onerror = (e) => reject(e);
            });
        }

        async function saveModelToDB(file) {
            if (!db) await initDB();
            if (!file.name) return;
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            
            const request = store.get(file.name);
            request.onsuccess = (e) => {
                const existing = e.target.result;
                store.put({ 
                    name: file.name, 
                    fileBlob: file, 
                    date: Date.now(),
                    thumbnail: existing ? existing.thumbnail : null 
                });
            };
        }

        async function updateModelThumbnailInDB(name, dataUrl) {
            if (!db) await initDB();
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const request = store.get(name);
            request.onsuccess = (e) => {
                const data = e.target.result;
                if (data) {
                    data.thumbnail = dataUrl;
                    store.put(data);
                }
            };
        }

        async function getRecentModels() {
            if (!db) await initDB();
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const request = tx.objectStore(STORE_NAME).getAll();
                request.onsuccess = () => resolve(request.result.sort((a, b) => b.date - a.date));
            });
        }

        async function deleteModelFromDB(name) {
            if (!db) await initDB();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(name);
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
            renderRecentGallery();
        }

        function confirmDeleteModel(name) {
            return new Promise(resolve => {
                const overlay = document.getElementById('confirm-overlay');
                const nameEl = document.getElementById('confirm-name');
                const okBtn = document.getElementById('confirm-ok');
                const cancelBtn = document.getElementById('confirm-cancel');
                nameEl.textContent = name;
                overlay.classList.add('active');

                const close = (result) => {
                    overlay.classList.remove('active');
                    okBtn.removeEventListener('click', onOk);
                    cancelBtn.removeEventListener('click', onCancel);
                    overlay.removeEventListener('click', onOverlay);
                    document.removeEventListener('keydown', onKey);
                    resolve(result);
                };
                const onOk = () => close(true);
                const onCancel = () => close(false);
                const onOverlay = (e) => { if (e.target === overlay) close(false); };
                const onKey = (e) => { if (e.key === 'Escape') close(false); };

                okBtn.addEventListener('click', onOk);
                cancelBtn.addEventListener('click', onCancel);
                overlay.addEventListener('click', onOverlay);
                document.addEventListener('keydown', onKey);
            });
        }

        function applyGalleryMarquees() {
            const gallery = document.getElementById('recent-gallery');
            if (!gallery) return;
            const isGrid = gallery.classList.contains('layout-grid');
            gallery.querySelectorAll('.recent-name').forEach(box => {
                const text = box.firstElementChild;
                if (!text) return;
                text.classList.remove('marquee');
                text.style.removeProperty('--marquee-dist');
                text.style.removeProperty('--marquee-dur');
                if (!isGrid) return;
                const cs = getComputedStyle(box);
                const avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
                const overflow = text.scrollWidth - avail;
                if (overflow > 1) {
                    text.style.setProperty('--marquee-dist', (-overflow) + 'px');
                    text.style.setProperty('--marquee-dur', (overflow / 25 + 2.5).toFixed(2) + 's');
                    text.classList.add('marquee');
                }
            });
        }

        function setupGalleryViewToggle() {
            const gallery = document.getElementById('recent-gallery');
            const btn = document.getElementById('view-toggle-btn');
            const icon = document.getElementById('view-icon');
            if (!gallery || !btn || !icon) return;

            const layouts = [
                {
                    class: 'layout-list',
                    title: 'Passer en grandes vignettes',
                    svg: '<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>'
                },
                {
                    class: 'layout-grid',
                    title: 'Passer en liste',
                    svg: '<line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>'
                }
            ];

            let currentLayoutIndex = parseInt(localStorage.getItem('galleryLayout'), 10);
            if (!(currentLayoutIndex >= 0 && currentLayoutIndex < layouts.length)) currentLayoutIndex = 0;

            function applyLayout() {
                gallery.className = layouts[currentLayoutIndex].class;
                icon.innerHTML = layouts[currentLayoutIndex].svg;
                btn.title = layouts[currentLayoutIndex].title;
                requestAnimationFrame(applyGalleryMarquees);
            }
            applyLayout();

            btn.addEventListener('click', () => {
                currentLayoutIndex = (currentLayoutIndex + 1) % layouts.length;
                localStorage.setItem('galleryLayout', currentLayoutIndex);
                applyLayout();
            });
        }

        async function renderRecentGallery() {
            const gallery = document.getElementById('recent-gallery');
            if (!gallery) return;

            const models = await getRecentModels();
            gallery.innerHTML = '';

            if (models.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'recent-empty';
                empty.textContent = "Aucun fichier dans l'historique";
                gallery.appendChild(empty);
                return;
            }

            const placeholder = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23ddd"/><text x="50" y="55" font-family="Arial" font-size="20" font-weight="bold" fill="%23888" text-anchor="middle">3D</text></svg>';

            models.forEach(model => {
                const item = document.createElement('div');
                item.className = 'recent-item';

                const infoDiv = document.createElement('div');
                infoDiv.className = 'recent-info';

                const thumb = document.createElement('img');
                thumb.className = 'recent-thumb';
                thumb.src = model.thumbnail || placeholder;

                const nameBox = document.createElement('div');
                nameBox.className = 'recent-name';
                nameBox.title = model.name;
                const nameText = document.createElement('div');
                nameText.className = 'recent-name-text';
                nameText.textContent = model.name;
                nameBox.appendChild(nameText);

                infoDiv.onclick = () => {
                    currentLoadedFileName = model.name;
                    currentModelBlob = model.fileBlob;
                    loadModelFromUrl(URL.createObjectURL(model.fileBlob));
                    saveModelToDB(model.fileBlob).then(renderRecentGallery);
                };

                const delBtn = document.createElement('button');
                delBtn.className = 'recent-delete';
                delBtn.innerHTML = '✕';
                delBtn.setAttribute('aria-label', 'Supprimer');
                delBtn.onclick = async (e) => {
                    e.stopPropagation();
                    if (await confirmDeleteModel(model.name)) {
                        deleteModelFromDB(model.name);
                    }
                };

                infoDiv.appendChild(thumb);
                infoDiv.appendChild(nameBox);
                item.appendChild(infoDiv);
                item.appendChild(delBtn);
                gallery.appendChild(item);
            });

            requestAnimationFrame(applyGalleryMarquees);
        }

        async function saveCurrentModelToDevice() {
            let blob = currentModelBlob;
            try {
                if (!blob && currentModelSourceUrl) {
                    const r = await fetch(currentModelSourceUrl);
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    blob = await r.blob();
                }
            } catch (err) {
                console.error('Téléchargement impossible :', err);
                alert("Impossible de récupérer le fichier à enregistrer.");
                return false;
            }
            if (!blob) {
                alert("Aucun fichier à enregistrer.");
                return false;
            }

            let name = currentLoadedFileName ||
                (currentModelSourceUrl ? decodeURIComponent(currentModelSourceUrl.split('?')[0].split('/').pop() || '') : '') ||
                'meuble.glb';
            if (!/\.glb$/i.test(name)) name += '.glb';

            const url = URL.createObjectURL(new Blob([blob], { type: 'model/gltf-binary' }));
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
            return true;
        }

        function loadFile(file) {
            currentLoadedFileName = file.name;
            currentModelBlob = file;
            saveModelToDB(file).then(renderRecentGallery);
            loadModelFromUrl(URL.createObjectURL(file));
        }
        
        async function loadSharedFile() {
            try {
                const cache = await caches.open('shared-file-cache');
                const key = new URL('./shared-file.glb', document.baseURI).href;
                const response = await cache.match(key);
                if (!response) return;
                const blob = await response.blob();
                await cache.delete(key);
                loadFile(blob);
            } catch (e) {
                console.error('Lecture du fichier partagé impossible :', e);
            } finally {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        function setupFileUploader() {
            const fileBtn = document.getElementById('file-btn');
            const fileInput = document.getElementById('file-input');
            const closeProjectBtn = document.getElementById('close-project-btn');

            const urlParams = new URLSearchParams(window.location.search);
            
            const saved = readSession();
            const hasLink = urlParams.has('m') || urlParams.has('model') || urlParams.has('shared');
            // Relance depuis l'icône (pas de lien) OU rechargement de la même page => reprise de session
            const resume = saved && saved.src && (!hasLink || saved.qs === window.location.search);

            if (resume) {
                skipSplash();
                document.getElementById('start-menu').style.display = 'none';
                document.getElementById('loader').style.display = 'flex';
                setTimeout(() => restoreSession(saved), 0);
            }
            else if (urlParams.has('m')) {
                currentModelUid = urlParams.get('m');
                pendingPartPid = urlParams.get('p');
                document.getElementById('start-menu').style.display = 'none';
                loadModelFromUrl(modelUrlFromUid(currentModelUid));
            }
            else if (urlParams.has('model')) {
                const cloudModelUrl = urlParams.get('model');
                pendingPartPid = urlParams.get('p');
                document.getElementById('start-menu').style.display = 'none';
                loadModelFromUrl(cloudModelUrl);
            } 
            else if (urlParams.has('shared')) {
                loadSharedFile();
            }

            if ('launchQueue' in window) {
                window.launchQueue.setConsumer(async (launchParams) => {
                    if (launchParams.files && launchParams.files.length > 0) {
                        loadFile(await launchParams.files[0].getFile());
                    }
                });
            }

            fileBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', function (event) {
                const file = event.target.files[0];
                if (file) loadFile(file);
            });

            closeProjectBtn.addEventListener('click', () => {
                clearSession();
                removeCurrentModel();
                document.getElementById('start-menu').style.display = 'flex';
                showUIElements(false);
                fileInput.value = "";
                resetViewState();
                renderRecentGallery(); 
            });
        }

        function removeCurrentModel() {
            if (globalModel) {
                scene.remove(globalModel);
                globalModel = null;
            }
        }

        function loadModelFromUrl(url) {
            if (String(url).startsWith('blob:')) {
                currentModelSourceUrl = null;
                currentModelUid = null;
            } else {
                currentModelSourceUrl = url;
                currentModelBlob = null;
            }
            removeCurrentModel();
            resetViewState();
            document.getElementById('start-menu').style.display = 'none';
            document.getElementById('loader').style.display = 'flex';

            const loader = new GLTFLoader();
            loader.load(url, function (gltf) {
                globalModel = gltf.scene;
                gltfAssociations = (gltf.parser && gltf.parser.associations) ? gltf.parser.associations : null;
                let sidCounter = 0;
                globalModel.traverse(o => { o.userData.sid = sidCounter++; });   // avant tout ajout (traits, contours)
                const fjRoot = gltf.userData && gltf.userData.finjat;
                if (fjRoot && fjRoot.model_uid) currentModelUid = String(fjRoot.model_uid);
                scene.add(globalModel);
                scene.updateMatrixWorld(true);

                globalBox = new THREE.Box3().setFromObject(globalModel);
                globalBox.getSize(originalGlobalSize); 
                
                activeBox = globalBox.clone();
                activeOriginalSize.copy(originalGlobalSize);
                
                currentModelName = currentLoadedFileName ? currentLoadedFileName.replace('.glb', '') : "Meuble Global";
                updateTopInfo(currentModelName, activeOriginalSize);

                const globalCenter = new THREE.Vector3();
                globalBox.getCenter(globalCenter);

                let partNodes = new Set();
                let uniqueMaterials = new Map();

                function getPartRoot(mesh) {
                    const p = mesh.parent;
                    if (p && p !== globalModel && p.type !== 'Scene' &&
                        p.children.length > 0 && p.children.every(c => c.isMesh)) {
                        return p;       
                    }
                    return mesh;        
                }

                globalModel.traverse(function (node) {
                    if (node.isMesh) {
                        const root = getPartRoot(node);
                        node.userData.partRoot = root;
                        partNodes.add(root);
                    }
                });

                // EXTRACTION DES MATÉRIAUX
                globalModel.traverse(function (node) {
                    if (node.isMesh) {
                        node.userData.isOriginalMesh = true;
                        node.userData.isHighlighted = false;

                        let mats = Array.isArray(node.material) ? node.material : [node.material];
                        let nodeMatKeys = [];
                        let nodeMatNames = [];
                        let isEdgeBandNode = false;

                        mats.forEach(mat => {
                            if (!mat) return;
                            const key = normMatName(mat);
                            const isEdge = isEdgeMatName(key);
                            
                            if (isEdge) isEdgeBandNode = true;
                            
                            if (!isEdge) {
                                const existing = uniqueMaterials.get(key);
                                if (!existing) {
                                    uniqueMaterials.set(key, { mat: mat, name: mat.name || "Default", thumb: null });
                                } else if (!existing.mat.map && mat.map) {
                                    existing.mat = mat;
                                }
                            }
                            nodeMatKeys.push(key);
                            nodeMatNames.push(mat.name || "Default");
                        });

                        node.userData.originalMaterialKeys = nodeMatKeys;
                        node.userData.originalMaterialNames = nodeMatNames;
                        node.userData.isEdgeBand = isEdgeBandNode;

                        if (Array.isArray(node.material)) {
                            node.userData.originalMaterial = node.material.map(m => {
                                let clone = m.clone();
                                clone.transparent = true; clone.polygonOffset = true;
                                clone.polygonOffsetFactor = 1; clone.polygonOffsetUnits = 1;
                                return clone;
                            });
                        } else {
                            let clone = node.material.clone();
                            clone.transparent = true; clone.polygonOffset = true;
                            clone.polygonOffsetFactor = 1; clone.polygonOffsetUnits = 1;
                            node.userData.originalMaterial = clone;
                        }

                        node.material = baseMaterial;
                        const edgesGeometry = new THREE.EdgesGeometry(node.geometry, 30);
                        node.add(new THREE.LineSegments(edgesGeometry, edgeMaterial));
                    }
                });

                const globalSizeMax = Math.max(originalGlobalSize.x, originalGlobalSize.y, originalGlobalSize.z) || 1;
                const namesToStrip = new Set();

                const isEdgeOnlyPart = (pn) => {
                    let any = false, all = true;
                    pn.traverse(n => {
                        if (n.isMesh && n.userData.isOriginalMesh) {
                            any = true;
                            if (!n.userData.isEdgeBand) all = false;
                        }
                    });
                    return any && all;
                };
                const edgeParts = [], panelParts = [];
                partNodes.forEach(pn => (isEdgeOnlyPart(pn) ? edgeParts : panelParts).push(pn));

                const hostTol = globalSizeMax * 0.003;
                const panelBoxes = new Map();
                panelParts.forEach(pn => {
                    panelBoxes.set(pn, new THREE.Box3().setFromObject(pn).expandByScalar(hostTol));
                });

                const edgeHost = new Map();
                edgeParts.forEach(ep => {
                    const eb = new THREE.Box3().setFromObject(ep);
                    let best = null, bestVol = 0;
                    panelBoxes.forEach((pb, pn) => {
                        const inter = eb.clone().intersect(pb);
                        if (inter.isEmpty()) return;
                        const sz = inter.getSize(new THREE.Vector3());
                        const vol = sz.x * sz.y * sz.z;
                        if (vol > bestVol) { bestVol = vol; best = pn; }
                    });
                    if (best) edgeHost.set(ep, best);
                });

                const hostBoxes = new Map();
                panelParts.forEach(pn => hostBoxes.set(pn, new THREE.Box3().setFromObject(pn)));

                animatedPartNodes = [];

                partNodes.forEach(partNode => {
                    partNode.userData.isPartNode = true;
                    partNode.userData.originalPosition = partNode.position.clone();
                    partNode.userData.originalQuaternion = partNode.quaternion.clone();
                    partNode.userData.originalScale = partNode.scale.clone();

                    // Sauvegarde des matrices en position fermée pour le moteur d'animation
                    partNode.updateMatrix();
                    partNode.userData.originalLocalMatrix = partNode.matrix.clone();
                    if (partNode.parent) {
                        partNode.parent.updateMatrixWorld(true);
                        partNode.userData.parentWorldMatrix = partNode.parent.matrixWorld.clone();
                        partNode.userData.parentWorldInverse = partNode.parent.matrixWorld.clone().invert();
                    } else {
                        partNode.userData.parentWorldMatrix = new THREE.Matrix4();
                        partNode.userData.parentWorldInverse = new THREE.Matrix4();
                    }

                    const hostPart = edgeHost.get(partNode);
                    const partBox = hostPart ? hostBoxes.get(hostPart)
                                             : new THREE.Box3().setFromObject(partNode);
                    const partCenter = new THREE.Vector3();
                    partBox.getCenter(partCenter);

                    let localGlobalCenter = globalCenter.clone();
                    let localPartCenter = partCenter.clone();
                    if (partNode.parent) {
                        localGlobalCenter = partNode.parent.worldToLocal(localGlobalCenter);
                        localPartCenter = partNode.parent.worldToLocal(localPartCenter);
                    }

                    const dir = new THREE.Vector3().subVectors(localPartCenter, localGlobalCenter);
                    if (dir.lengthSq() < 1e-8) dir.set(0, globalSizeMax * 0.3, 0); 
                    partNode.userData.explodeDirection = dir;
                    partNode.userData.assemblyStep = 0;

                    let foundAnimCfg = null;
                    let foundAssembly = null;
                    const checkNode = (n) => {
                        const match = n.name && n.name.match(/__STEP(\d+)/i);
                        if (match) {
                            const step = parseInt(match[1], 10);
                            if (step > partNode.userData.assemblyStep) partNode.userData.assemblyStep = step;
                            if (step > maxAssemblyStep) maxAssemblyStep = step;
                            namesToStrip.add(n);
                        }
                        // Détection des données d'animation injectées dans node.extras.finjat.animation
                        if (!foundAnimCfg && n.userData && n.userData.finjat && n.userData.finjat.animation) {
                            foundAnimCfg = n.userData.finjat.animation;
                        }
                        // Info d'assemblage hiérarchique (node.extras.finjat.assembly)
                        if (!foundAssembly && n.userData && n.userData.finjat && n.userData.finjat.assembly) {
                            foundAssembly = n.userData.finjat.assembly;
                        }
                    };
                    partNode.traverse(checkNode);
                    for (let a = partNode.parent; a && a !== globalModel; a = a.parent) checkNode(a);
                        if (foundAssembly) partNode.userData.assembly = foundAssembly;

                    if (foundAnimCfg && Array.isArray(foundAnimCfg.steps) && foundAnimCfg.steps.length > 0) {
                        partNode.userData.animationCfg = foundAnimCfg;
                        partNode.userData.animState = { t: 0.0, target: 0.0 };
                        animatedPartNodes.push(partNode);
                    }
                });

                // Les chants héritent de l'étape de montage ET suivent l'animation de leur panneau hôte
                edgeHost.forEach((host, ep) => {
                    ep.userData.assemblyStep = host.userData.assemblyStep;
                    ep.userData.assembly = host.userData.assembly;   // le chant suit l'assemblage de son panneau
                    ep.userData.hostPart = host;
                    if (!host.userData.attachedEdgeParts) host.userData.attachedEdgeParts = [];
                    host.userData.attachedEdgeParts.push(ep);
                });

                // Séquence d'assemblage hiérarchique lue dans le .glb
                const asmGroups = (gltf.userData && gltf.userData.finjat) ? gltf.userData.finjat.assembly_groups : null;
                assemblyHierarchy = buildAssemblyHierarchy(asmGroups, partNodes, edgeHost, globalCenter, globalSizeMax);
                if (assemblyHierarchy) {
                    maxAssemblyStep = assemblyHierarchy.total;
                    console.log(`Finjat: séquence hiérarchique détectée (${assemblyHierarchy.groups.length} niveaux, ${assemblyHierarchy.total} étapes).`);
                }

                namesToStrip.forEach(n => { n.name = n.name.replace(/__STEP\d+/i, '').trim(); });

                console.log(`Finjat: ${animatedPartNodes.length} pièce(s) animée(s) détectée(s).`);
                buildAnimPips();
                rebuildTapeTargets();

                // ÉPAISSEURS PAR MATÉRIAU (extraites de la géométrie)
                const matThickness = computeMaterialThicknesses(uniqueMaterials);

                // GÉNÉRATION DES BOUTONS FILTRES DE MATÉRIAUX
                const matContainer = document.getElementById('material-filter-container');
                matContainer.innerHTML = '';
                
                uniqueMaterials.forEach((entry, matKey) => {
                    const mat = entry.mat;
                    const mName = entry.name;
                    const btn = document.createElement('button');
                    btn.className = 'mat-filter-btn';
                    btn.dataset.matKey = matKey;
                    btn.title = mName;

                    const thumb = mat.map ? makeTextureThumb(mat.map) : null;

                    let darkBg = true;   // texture => texte blanc + ombre
                    if (thumb) {
                        btn.style.backgroundImage = `url(${thumb})`;
                    } else {
                        const col = mat.color ? mat.color : new THREE.Color(0xcccccc);
                        btn.style.backgroundColor = '#' + col.getHexString();
                        const hsl = {}; col.getHSL(hsl);
                        darkBg = hsl.l < 0.5;
                    }

                    const ini = document.createElement('span');
                    ini.className = 'mat-ini';
                    ini.textContent = materialInitials(mName);
                    ini.style.color = darkBg ? '#ffffff' : '#111111';
                    ini.style.textShadow = darkBg
                        ? '0 0 3px rgba(0,0,0,0.9), 0 0 1px #000'
                        : '0 0 3px rgba(255,255,255,0.9)';
                    btn.appendChild(ini);

                    const th = matThickness.get(matKey);
                    if (th) {
                        const badge = document.createElement('span');
                        badge.className = 'mat-th';
                        badge.textContent = th;
                        btn.appendChild(badge);
                    }
                    btn.title = th ? `${mName} — ${th} mm` : mName;

                    btn.onclick = () => {
                        // Sélection exclusive : un seul matériau actif à la fois
                        const wasActive = activeMaterialFilters.has(matKey);
                        activeMaterialFilters.clear();
                        matContainer.querySelectorAll('.mat-filter-btn.active')
                            .forEach(b => b.classList.remove('active'));
                        if (!wasActive) {
                            activeMaterialFilters.add(matKey);
                            btn.classList.add('active');
                        }

                        if (activeMaterialFilters.size === 0) {
                            updateTopInfo(currentModelName, activeOriginalSize);
                        } else {
                            const names = Array.from(activeMaterialFilters).map(k => {
                                const e = uniqueMaterials.get(k);
                                return e ? e.name : k;
                            });
                            updateTopInfo("Filtre Actif", activeOriginalSize, names.join(" + "));
                        }
                        updateMaterials();
                    };
                    matContainer.appendChild(btn);
                });

                const asmBtn = document.getElementById('assembly-mode-btn');
                const stepCtrl = document.getElementById('step-controls-container');
                const animBtn = document.getElementById('anim-mode-btn');

                focusOnGlobalModel(true);
                
                if (currentLoadedFileName) {
                    setTimeout(() => {
                        renderer.render(scene, camera); 
                        const dataUrl = renderer.domElement.toDataURL('image/jpeg', 0.6);
                        updateModelThumbnailInDB(currentLoadedFileName, dataUrl).then(() => {
                            renderRecentGallery(); 
                        });
                    }, 800); 
                }
                
                document.getElementById('loader').style.display = 'none';
                showUIElements(true);

                if (uniqueMaterials.size === 0) {
                    matContainer.style.display = 'none';
                    document.getElementById('mat-toggle-btn').style.display = 'none';
                }                
                if (maxAssemblyStep === 0) {
                    if(asmBtn) asmBtn.style.display = 'none';
                    if(stepCtrl) stepCtrl.style.display = 'none';
                } else {
                    if(asmBtn) asmBtn.style.display = 'flex';
                    if(stepCtrl) stepCtrl.style.display = 'flex';
                    const stepInd = document.getElementById('step-indicator');
                    if(stepInd) stepInd.innerText = `0/${maxAssemblyStep}`;
                }

                // Afficher le bouton d'animation (toujours visible pour tester son .glb)
                if (animBtn) animBtn.style.display = 'flex';

                if (pendingSession) {
                    const st = pendingSession;
                    pendingSession = null;
                    pendingPartPid = null;
                    try { applySessionState(st); } catch (e) { console.warn('Finjat: reprise partielle', e); }
                } else if (pendingPartPid) {
                    const pid = pendingPartPid;
                    pendingPartPid = null;
                    setTimeout(() => highlightPartByPid(pid), 50);
                }
                
                URL.revokeObjectURL(url);
            }, undefined, function (err) {
                console.error(err);
                pendingPartPid = null;
                if (pendingSession) { pendingSession = null; clearSession(); }
                URL.revokeObjectURL(url);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('start-menu').style.display = 'flex';
                alert("Impossible de lire ce fichier .glb.");
            });
        }

        // ==========================================
        // LIENS FINJAT (QR des étiquettes) : ?m=<meuble>&p=<pièce>
        // ==========================================
        function modelUrlFromUid(uid) {
            return SUPABASE_MODELS_URL + encodeURIComponent(uid) + '.glb?t=' + Date.now();
        }

        function parseFinjatLink(text) {
            const match = String(text || '').match(/https?:\/\/\S+/i);   // tolère "ID Nom URL" dans le QR
            if (!match) return null;
            let u;
            try { u = new URL(match[0]); } catch (e) { return null; }
            const uid = u.searchParams.get('m');
            const modelUrl = u.searchParams.get('model');
            const pid = u.searchParams.get('p');
            if (!uid && !modelUrl && !pid) return null;
            return { uid, modelUrl, pid };
        }

        function openFinjatLink(link) {
            const sameModel = globalModel && (
                (link.uid && link.uid === currentModelUid) ||
                (!link.uid && link.modelUrl && link.modelUrl === currentModelSourceUrl) ||
                (!link.uid && !link.modelUrl));
            if (sameModel) {
                if (link.pid) highlightPartByPid(link.pid);
                return;
            }
            pendingPartPid = link.pid || null;
            currentLoadedFileName = null;
            currentModelBlob = null;
            if (link.uid) {
                currentModelUid = link.uid;
                loadModelFromUrl(modelUrlFromUid(link.uid));
            } else {
                currentModelUid = null;
                loadModelFromUrl(link.modelUrl);
            }
        }

        function applyScanHighlight(meshes, title) {
            clearScanHighlight();
            meshes.forEach(m => { m.userData.isHighlighted = true; });
            scannedMeshes = meshes;
            scannedTitle = title;
            updateMaterials();
            showTargetInfo(scannedMeshes, scannedTitle, "Défaut");
            isZoomedOnPart = true;
            focusOnHighlightedPart();
        }

        function highlightPartByPid(pid) {
            if (!globalModel) return;
            const key = String(pid).toLowerCase();
            const nodes = [];
            globalModel.traverse(n => {
                const f = n.userData && n.userData.finjat;
                if (f && f.pid && String(f.pid).toLowerCase() === key) nodes.push(n);
            });
            const meshes = [];
            nodes.forEach(n => getPartMeshes(n).forEach(m => { if (!meshes.includes(m)) meshes.push(m); }));
            if (meshes.length === 0) {
                alert("Pièce introuvable dans ce meuble.\nRéf : " + pid);
                return;
            }
            const title = (nodes[0].name || 'Pièce').replace(/[^a-zA-Z0-9_-]/g, ' ').trim() || 'Pièce';
            applyScanHighlight(meshes, title);
        }

        function highlightScannedPart(scannedText) {
            const link = parseFinjatLink(scannedText);   // accepte "4,https://…" (ID ABF en préfixe)
            if (link) { openFinjatLink(link); return; }
            if (!globalModel) {
                alert("Ce code QR ne contient pas de lien Finjat.\nCode lu : " + scannedText);
                return;
            }

            let targetMeshes = [];

            globalModel.traverse(function (node) {
                if (node.isMesh && node.userData.isOriginalMesh) {
                    let matchFound = false;
                    let current = node;

                    while (current && current !== globalModel) {
                        if (current.name) {
                            let pName = current.name.toLowerCase().trim();
                            let sText = scannedText.toLowerCase().trim();
                            
                            let sClean = sText.replace(/^(cible|pi[eè]ce)\s*[:\-]?\s*/i, '').trim();

                            if (pName === sClean || pName === sText) {
                                matchFound = true; break;
                            }

                            let pSpaced = pName.replace(/[^a-z0-9]/g, ' ').trim();
                            let sSpaced = sClean.replace(/[^a-z0-9]/g, ' ').trim();

                            if (pSpaced === sSpaced && pSpaced !== '') {
                                matchFound = true; break;
                            }

                            if (pSpaced.length > 0 && sSpaced.length > 0) {
                                let regexP = new RegExp('\\b' + pSpaced + '\\b');
                                let regexS = new RegExp('\\b' + sSpaced + '\\b');

                                if (regexP.test(sSpaced) || regexS.test(pSpaced)) {
                                    matchFound = true; break;
                                }
                            }
                        }
                        current = current.parent; 
                    }
                    
                    if (matchFound) targetMeshes.push(node);
                }
            });

            if (targetMeshes.length > 0) {
                clearScanHighlight();   // remplace l'ancien scan uniquement, le contour tactile reste
                targetMeshes.forEach(m => { m.userData.isHighlighted = true; });
                scannedMeshes = targetMeshes;
                scannedTitle = scannedText.replace(/^(Cible|Pi[eè]ce)\s*[:\-]?\s*/i, '').trim();
                updateMaterials();
                showTargetInfo(scannedMeshes, scannedTitle, "Défaut");
                isZoomedOnPart = true;
                focusOnHighlightedPart();
            } else {
                alert("Pièce introuvable dans ce meuble.\nCode lu : " + scannedText);
            }
        }

        function setupScanner() {
            const scanBtn = document.getElementById('scan-btn');
            const closeBtn = document.getElementById('close-scan-btn');
            const container = document.getElementById('reader-container');
            let html5QrCode = null;
            let isScannerOpen = false;

            function stopAndHideScanner() {
                if (!isScannerOpen) return;
                isScannerOpen = false;
                if (html5QrCode) {
                    html5QrCode.stop().then(() => { 
                        container.style.display = 'none'; 
                        html5QrCode = null;
                    }).catch(() => { 
                        container.style.display = 'none'; 
                        html5QrCode = null;
                    });
                } else {
                    container.style.display = 'none';
                }
            }

            window.addEventListener('popstate', (event) => {
                if (isScannerOpen) stopAndHideScanner();
            });

            function openScanner() {
                if (isScannerOpen) return;
                isScannerOpen = true;
                container.style.display = 'block';

                window.history.pushState({ scannerOpen: true }, "");

                let handled = false;   // évite un double chargement si le QR est lu plusieurs fois
                html5QrCode = new Html5Qrcode("reader", {
                    experimentalFeatures: { useBarCodeDetectorIfSupported: true }   // lecteur natif Android : meilleur sur petits QR
                });
                html5QrCode.start(
                    { facingMode: "environment" },
                    {
                        fps: 15,
                        qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.75); return { width: s, height: s }; }
                    },
                    (decodedText) => {
                        if (handled) return;
                        handled = true;
                        window.history.back();
                        highlightScannedPart(decodedText);
                    },
                    () => {}
                ).catch(() => {
                    alert("Impossible d'accéder à la caméra.");
                    window.history.back();
                });
            }

            scanBtn.addEventListener('click', () => {
                scanBtn.classList.remove('burst-active');
                void scanBtn.offsetWidth;
                scanBtn.classList.add('burst-active');
                openScanner();
            });

            const homeScanBtn = document.getElementById('home-scan-btn');
            if (homeScanBtn) homeScanBtn.addEventListener('click', openScanner);

            closeBtn.addEventListener('click', () => {
                window.history.back();
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            outlineMat.resolution.set(window.innerWidth, window.innerHeight);
            tapeLineMat.resolution.set(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min((now - lastFrameTime) / 1000.0, 0.1);
            lastFrameTime = now;

            updateAnimations(dt);
            controls.update();
            updateMeasurementLabels();
            updateAnimPips();
            updateSelectionOutline();
            updateTapeOverlay();
            renderer.render(scene, camera);
        }

        // ==========================================
        // DÉMARRAGE DE L'HISTORIQUE
        // ==========================================
        setupGalleryViewToggle();
        initDB().then(() => renderRecentGallery())
                .catch(err => console.error("Erreur DB:", err));

        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(() => {});
        }
        window.addEventListener('resize', () => applyGalleryMarquees());

        // Sauvegarde dès que l'app passe en arrière-plan (accueil, autre app, verrouillage)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') saveSession();
        });
        window.addEventListener('pagehide', saveSession);
    </script>
