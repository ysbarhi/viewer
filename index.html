<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Viewer CAO - Performance</title>
    <style>
        /* Le touch-action: none est CRUCIAL pour empêcher le navigateur d'interférer avec la 3D */
        body { margin: 0; overflow: hidden; background-color: #dddddd; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #loader {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #dddddd; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 999;
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid #bbb;
            border-top: 4px solid #ff0000; border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #ui-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #ffffff; border: 2px solid #ff0000; color: #000; 
            padding: 10px 20px; border-radius: 5px; font-weight: bold; font-size: 16px;
            pointer-events: none; white-space: nowrap; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <div id="canvas-container"></div>
    <div id="ui-panel" style="display: none;"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');

        let scene, camera, renderer, controls;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdddddd); // Fond gris neutre CAO

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            // Rendu basique, aucune option gourmande
            renderer = new THREE.WebGLRenderer({ antialias: false }); // Antialias désactivé pour max FPS sur vieux mobiles
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Contrôles optimisés CAO
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.15; // Réactivité maximale
            controls.enablePan = true; // Autorise le glissement à 2 doigts
            controls.screenSpacePanning = true; // Glissement parallèle à l'écran (très naturel)
            controls.zoomSpeed = 1.2; // Zoom légèrement plus rapide

            // Lumière très basique pour révéler les volumes sans calculs lourds
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const loader = new GLTFLoader();
            loader.load('scene.glb', function (gltf) {
                const model = gltf.scene;
                scene.add(model);

                let targetNode = null;

                // Matériaux ultra-légers
                const baseMaterial = new THREE.MeshLambertMaterial({ 
                    color: 0xaaaaaa // Gris CAO standard
                });

                const highlightMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0xff0000, // Rouge pur
                    depthTest: false // Reste visible même caché dans le meuble
                });

                model.traverse(function (node) {
                    if (node.isMesh) {
                        if (targetId && node.name.includes(targetId)) {
                            targetNode = node;
                            node.material = highlightMaterial;
                            node.renderOrder = 999;
                        } else {
                            node.material = baseMaterial;
                        }
                    }
                });

                if (targetNode) {
                    const box = new THREE.Box3();
                    targetNode.traverse(function(child) {
                        if (child.isMesh && child.geometry) {
                            child.geometry.computeBoundingBox();
                            let childBox = child.geometry.boundingBox.clone();
                            childBox.applyMatrix4(child.matrixWorld);
                            box.union(childBox);
                        }
                    });

                    const center = new THREE.Vector3();
                    box.getCenter(center);
                    const size = new THREE.Vector3();
                    box.getSize(size);

                    // Verrouillage du pivot sur la pièce
                    controls.target.copy(center);

                    // Recul de la caméra ajusté
                    const maxDim = Math.max(size.x, size.y, size.z);
                    let cameraDistance = maxDim * 2.5; 
                    if(cameraDistance < 0.5) cameraDistance = 0.5;

                    camera.position.set(center.x + cameraDistance, center.y + cameraDistance, center.z + cameraDistance);
                    
                    const uiPanel = document.getElementById('ui-panel');
                    uiPanel.style.display = 'block';
                    uiPanel.innerText = targetId.replace('obj_', '').split('_')[0].toUpperCase();
                } else {
                    const box = new THREE.Box3().setFromObject(model);
                    const center = new THREE.Vector3();
                    box.getCenter(center);
                    controls.target.copy(center);
                    camera.position.set(center.x + 3, center.y + 3, center.z + 3);
                }

                document.getElementById('loader').style.display = 'none';
            });

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
